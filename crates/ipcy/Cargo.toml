[package]
name = "ipcy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
getrandom = "0.2"
thiserror = "1"
log = "0.4"
paste = "1"
bitflags = "2"

# The Unix-socket driver (drivers::unix) is Linux-only:
# it relies on memfd and SOCK_CLOEXEC/MSG_NOSIGNAL.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.28", features = ["socket", "uio", "mman", "fs"] }
memfd = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
env_logger = "0.11"
